name: test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ['1.24', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: examples module
        working-directory: examples
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
      - name: oracle module (differential tests against charmbracelet/x/vt)
        working-directory: oracle
        run: |
          go vet ./...
          go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: fuzz smoke (30s per target)
        run: |
          for f in FuzzTokens FuzzStream FuzzChunking FuzzWrite FuzzDamage FuzzReplies; do
            go test -run '^$' -fuzz "^$f\$" -fuzztime 30s . || exit 1
          done
          cd oracle && go test -run '^$' -fuzz '^FuzzOracle$' -fuzztime 30s .
      - name: keep crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
